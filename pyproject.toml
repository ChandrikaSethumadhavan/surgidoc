[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surgidoc"
version = "0.1.0"
description = "Endoscopy documentation assistant: video to cited, human-approved draft report"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.2",
    "pydantic>=2.10",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opencv-python-headless>=4.10",
    "fpdf2>=2.8",
    "pypdf>=5.0",
    "cryptography>=44.0",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
kaggle = ["kagglehub>=1.0"]
ocr = ["pytesseract>=0.3.10", "pillow>=10.0"]

[tool.setuptools.packages.find]
include = ["surgidoc*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
